name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Build Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .build/probe-rs -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libudev-dev libxkbcommon-dev libwayland-dev

      - name: Build
        run: ./scripts/bootstrap.sh

      - name: Package
        run: |
          mkdir -p out
          cp .build/probe-rs/dist/probe-rs-flasher out/
          cd out && sha256sum probe-rs-flasher > probe-rs-flasher.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: out/*
          if-no-files-found: error

  windows:
    name: Build Windows x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .build/probe-rs -> target

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 \
            pkg-config libudev-dev libxkbcommon-dev libwayland-dev

      - name: Prepare workspace
        run: BOOTSTRAP_PREPARE_ONLY=1 ./scripts/bootstrap.sh

      - name: Build
        working-directory: .build/probe-rs
        run: bash probe-rs-flasher/build-windows.sh

      - name: Package
        run: |
          mkdir -p out
          cp .build/probe-rs/dist/probe-rs-flasher.exe out/
          cd out && sha256sum probe-rs-flasher.exe > probe-rs-flasher.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          name: Probe-rs Flasher ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/linux-x86_64/*
            artifacts/windows-x64/*
